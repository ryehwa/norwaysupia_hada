# 모든 설정값은 환경변수로 주입한다. 기본값을 두지 않으므로
# 미설정 시 기동이 실패한다. 로컬 값은 backend/.env 참고.
spring:
  application:
    name: hadasupia
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: true
      # Instant 를 datetime 컬럼에 쓸 때 기준 시간대. KST 로 저장해
      # DB 콘솔에서 조회한 값과 화면에 보이는 값이 일치하게 한다.
      # (국내 전용 서비스이고 KST 는 서머타임이 없어 모호함이 생기지 않는다)
      hibernate.jdbc.time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # 값이 없으면 무한 대기라 비동기 스레드가 물린다. 정상 발송은 1초 안에 끝난다.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080

app:
  frontend-origin: ${FRONTEND_ORIGIN}
  upload-dir: ${UPLOAD_DIR}
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  mail:
    to: ${MAIL_TO}
    enabled: ${MAIL_ENABLED}
    # 발송에 실패한 알림을 다시 시도하는 주기
    retry-interval-ms: 300000
  consult:
    open-time: "11:00"
    close-time: "20:30"
    step-minutes: 30
    duration-minutes: 60
    bookable-days: 30

logging:
  level:
    com.hadasupia: DEBUG
